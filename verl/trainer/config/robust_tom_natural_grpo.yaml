defaults:
  - ppo_trainer
  - _self_

data:
  train_files: data/grpo/counterfactual_process_reward_v4_natural_compact/train.parquet
  val_files: data/grpo/counterfactual_process_reward_v4_natural_compact/val.parquet
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 384
  train_batch_size: 8
  val_batch_size: 32
  apply_chat_template: true
  return_raw_chat: false
  seed: 2026

actor_rollout_ref:
  hybrid_engine: true
  use_trajectory_batch_sizes: true
  model:
    path: runs/final
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: 2
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 4864
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    entropy_coeff: 0.001
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    optim:
      lr: 5.0e-7
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: null
      warmup_style: constant
      total_training_steps: -1
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      fsdp_size: -1
  ref:
    model_path: runs/final
    fsdp_config:
      param_offload: true
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1
    log_prob_micro_batch_size: 4
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 9728
    ulysses_sequence_parallel_size: 1
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.35
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 128
    log_prob_micro_batch_size: 4
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 9728
    do_sample: true
    n: 16
    seed: 2026

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

reward:
  mode: natural_cot_judge
  process_weight: 0.75
  answer_weight: 0.2
  structure_weight: 0.05
  state_weight_within_step: 0.4
  reasoning_weight_within_step: 0.6
  judge:
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    thinking: disabled
    max_tokens: 3000
    timeout_seconds: 60
    retries: 4
    retry_backoff_seconds: 2.0
    max_workers: 8
    preflight_remote: true
    cache_enabled: true
    cache_dir: ${trainer.default_local_dir}/judge_cache
  validation:
    judge_enabled: false

trainer:
  total_epochs: 2
  total_training_steps: 800
  project_name: robust_tom_natural_grpo_v4_compact
  experiment_name: qwen25_3b_compact_natural_cot_judge_n16_seed2026
  logger: [console, wandb]
  progress_bar: true
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: 400
  test_freq: 50
  save_at_end: true
  validate_at_end: true
  val_before_train: true
  val_only: false
  critic_warmup: 0
  seed: 2026
  resume_from_path: null
  default_hdfs_dir: null
  default_local_dir: runs/grpo/${trainer.experiment_name}
